name: content-freshness-monitor

# Independent freshness observer for this repo's own content, per
# adrianwedd/failure-first-embodied-ai#1089 (2026-08-20 vacation-readiness
# audit finding). The private repo drives content into this repo via
# `publish: scheduled automated deploy` commits; nothing here or there was
# watching whether those commits actually kept landing. 08-10 and
# 08-14..08-17 (2026) were silent 4-day gaps nobody found from the public
# repo alone. This runs on GitHub's clock (laptop-independent, same
# reasoning as podcast-feed-monitor.yml) and checks git history directly —
# not a script's own log, which a dead automation host would never write.
#
# Deliberately does NOT touch Discord/Telegram or any cross-repo secret: a
# stale-content finding is routine organisational work (per the vacation
# goal, "a watchdog firing" is never itself an escalation), so this only
# files/updates/closes a durable issue in THIS repo using the default
# GITHUB_TOKEN — no new credential, mirrors external-intel-health.yml's design
# in the private repo.
#
# 2026-09-28 (#37): the monitor detected staleness but had no recovery branch,
# so issue #37 stayed OPEN from 5 September while content commits resumed on
# 15/17 September and every run since went green. Added below: a fresh-state
# reconciliation that closes *only* this monitor's own alert (exact title match
# within the `content-freshness` label), with a measured recovery receipt and a
# readback; a fresh run with no matching open alert writes nothing; an unknown
# or unusable measurement closes nothing; a failed API call fails the job. The
# staleness detection and fail-on-stale semantics are unchanged.

on:
  schedule:
    - cron: '40 6 * * *'   # daily 06:40 UTC — offset from podcast-feed-monitor (06:17)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check content publish cadence
        id: freshness
        run: |
          set -euo pipefail
          MAX_AGE_HOURS=48
          LATEST=$(git log -1 --format=%cI -- \
            site/src/content/daily-paper/ \
            site/src/content/blog/ \
            site/src/content/ai-safety-daily/ 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "::error::No commit history found for content paths -- cannot assess freshness"
            echo "stale=unknown" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          LATEST_SHA=$(git log -1 --format=%H -- \
            site/src/content/daily-paper/ \
            site/src/content/blog/ \
            site/src/content/ai-safety-daily/)
          LATEST_EPOCH=$(date -d "$LATEST" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE_HOURS=$(( (NOW_EPOCH - LATEST_EPOCH) / 3600 ))
          echo "Newest content commit: $LATEST ($AGE_HOURS hours ago)"
          {
            echo "age_hours=$AGE_HOURS"
            echo "max_age_hours=$MAX_AGE_HOURS"
            echo "latest_commit_date=$LATEST"
            echo "latest_commit_sha=$LATEST_SHA"
          } >> "$GITHUB_OUTPUT"
          if [ "$AGE_HOURS" -gt "$MAX_AGE_HOURS" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::error::Content publish cadence stale: newest content commit is ${AGE_HOURS}h old (threshold ${MAX_AGE_HOURS}h)"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      # Context values go through the environment rather than `${{ }}`
      # interpolation into the script body: a shell/expression-injected value
      # should never be able to alter the programme being run.
      - name: Export monitor context
        if: always()
        env:
          MEASURED_LATEST: ${{ steps.freshness.outputs.latest_commit_date }}
          MEASURED_AGE_HOURS: ${{ steps.freshness.outputs.age_hours }}
          MEASURED_MAX_AGE_HOURS: ${{ steps.freshness.outputs.max_age_hours }}
          MEASURED_LATEST_SHA: ${{ steps.freshness.outputs.latest_commit_sha }}
          RUN_HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "MEASURED_LATEST=$MEASURED_LATEST"
            echo "MEASURED_AGE_HOURS=$MEASURED_AGE_HOURS"
            echo "MEASURED_MAX_AGE_HOURS=$MEASURED_MAX_AGE_HOURS"
            echo "MEASURED_LATEST_SHA=$MEASURED_LATEST_SHA"
            echo "RUN_HEAD_SHA=$RUN_HEAD_SHA"
            echo "RUN_URL=$RUN_URL"
          } >> "$GITHUB_ENV"

      - name: File or update staleness issue
        if: always() && steps.freshness.outputs.stale == 'true'
        uses: actions/github-script@v7
        env:
          SCRIPT_PATH: ${{ github.workspace }}/scripts/content-freshness-reconciliation.mjs
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { fileOrUpdateStaleAlert } = await import(pathToFileURL(process.env.SCRIPT_PATH).href);
            const result = await fileOrUpdateStaleAlert({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              measurement: {
                latest_commit_iso: process.env.MEASURED_LATEST,
                age_hours: Number(process.env.MEASURED_AGE_HOURS),
                threshold_hours: Number(process.env.MEASURED_MAX_AGE_HOURS),
              },
            });
            core.info(`stale alert ${result.action} (issue #${result.issue_number})`);

      - name: Reconcile recovered (fresh) state
        if: success() && steps.freshness.outputs.stale == 'false'
        uses: actions/github-script@v7
        env:
          SCRIPT_PATH: ${{ github.workspace }}/scripts/content-freshness-reconciliation.mjs
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { reconcileFreshState } = await import(pathToFileURL(process.env.SCRIPT_PATH).href);
            const result = await reconcileFreshState({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              measurement: {
                status: 'fresh',
                latest_commit_iso: process.env.MEASURED_LATEST,
                latest_commit_sha: process.env.MEASURED_LATEST_SHA,
                age_hours: Number(process.env.MEASURED_AGE_HOURS),
                threshold_hours: Number(process.env.MEASURED_MAX_AGE_HOURS),
                run_head_sha: process.env.RUN_HEAD_SHA,
                run_url: process.env.RUN_URL,
              },
              log: (line) => core.info(line),
            });
            core.info(
              `fresh reconciliation: ${result.action}; closed [${result.closed.join(', ')}]` +
              `; commented [${result.commented.join(', ')}]`
            );

      - name: Fail the job on staleness
        if: steps.freshness.outputs.stale == 'true'
        run: exit 1
